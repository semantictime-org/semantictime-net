# 製品（路線）。id は記事の置き場所（src/content/articles/<id>/）と URL（/<id>/<slug>/）になる。
# code は記事番号の記号（CC07 の CC）。全製品で重複させない（重複するとビルドが失敗する）。
# categories は検証期限と絞り込みに使う分野（chat / coding / agent / api / image / video / audio）。
# route は読む順。記事を書いたら slug を足す。載せ忘れた記事は「そのほか」に番号順で並ぶ。
# routeUpdated は読む順を入れ替えた日（製品のページに表示する）。

# --- 共通（会社に属さない路線。vendor を書かない） ---
