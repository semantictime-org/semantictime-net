# 機能レジストリ（機能のステータスと日付の唯一の情報源）
#
# 初版: 2026-11-15。出典は code.claude.com/docs/llms.txt、claude.com/docs/llms.txt、
# code.claude.com/docs/en/feature-availability。
#
# status の付け方:
# - beta / removed: 公式ドキュメントに beta・experimental・removed の表記があるもの（experimental は beta 扱い）
# - ga: 公式に beta などの表記がないもの（2026-11-15 時点。正式版と明記されているとは限らない）
#
# aliases: 上流の変更（changelog など）との照合に使う。一般的すぎる語（hooks、skills など）は入れず、
#          その機能だけを指す語（イベント名、コマンド、ファイル名、製品名）にする。
# since: 公式の資料で確かめられた日付だけを書く（初版では空）。

