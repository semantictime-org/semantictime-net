name: preview

# PR ごとのプレビュー（設計書 9.1）。下書きを含めてビルドし、noindex を付けて workers.dev に上げる。
# - build : PR のコードでビルドする。秘密情報は使わない。
# - upload: main のコードだけを checkout し、build の成果物（静的なファイル）をデータとして受け取って上げる。
#           Environment preview のトークンを使うので、PR のコードはここでは実行しない。fork の PR では動かさない。
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/fonts
          key: astro-fonts-${{ hashFiles('astro.config.ts') }}
      - run: npm run build
        env:
          PUBLIC_DEPLOY_ENV: preview
      - uses: actions/upload-artifact@v7
        with:
          name: preview-dist
          path: dist
          retention-days: 1

  upload:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # main のコードだけを使う（noindex を足すスクリプトと wrangler の設定）
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: preview-dist
          path: dist
      - run: node scripts/add-noindex-headers.ts dist/_headers
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 初回は Worker がまだないので、一度だけ deploy して作る
          if ! npx wrangler deployments list --config wrangler.preview.jsonc >/dev/null 2>&1; then
            npx wrangler deploy --config wrangler.preview.jsonc
          fi
          npx wrangler versions upload --config wrangler.preview.jsonc --message "PR #${PR_NUMBER}" | tee upload.log
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | tail -1)"
          if [ -z "$url" ]; then echo "プレビューの URL が見つからない" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          body="プレビュー（下書きを含む・noindex）: ${URL}"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
