name: ci

# 必須チェックは ci-required の1つだけ（ruleset で指定）。
# - build-checks  : PR のコードで lint / typecheck / test / build を行う。秘密情報は使わない。
# - trusted-checks: main 側のスクリプトで公開上限と検証ゲートを判定する（Task 2.4・2.5 で実装。今は仮）。
# - ci-required   : 上の2つの結果を集約する。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-checks:
    runs-on: ubuntu-latest
    # edited（本文の編集）でも飛ばさない。必須チェックは同じ commit の最後の結果で決まるため、
    # 飛ばすと「ビルド失敗の PR でも本文を編集すれば合格になる」穴ができる。
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  trusted-checks:
    runs-on: ubuntu-latest
    steps:
      - run: echo "trusted-checks placeholder (event=${{ github.event.action }}). Task 2.4/2.5 で公開上限と検証ゲートを実装する。"

  ci-required:
    runs-on: ubuntu-latest
    needs: [build-checks, trusted-checks]
    if: always()
    steps:
      - name: Aggregate results
        env:
          BUILD: ${{ needs.build-checks.result }}
          TRUSTED: ${{ needs.trusted-checks.result }}
        run: |
          echo "build-checks=$BUILD trusted-checks=$TRUSTED"
          [ "$BUILD" = "success" ] && [ "$TRUSTED" = "success" ]
