<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検索結果</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700;900&amp;family=Anton&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1A3CFF;text-underline-offset:3px;transition:color 150ms ease-out}
@media (hover:hover){a:hover{color:#0F2BD6}}
::selection{background:#DBE4FF;color:#172343}
:focus-visible{outline:2px solid #1A3CFF;outline-offset:2px}
h1,h2,h3{text-wrap:balance;word-break:auto-phrase}p,li,dd{text-wrap:pretty}
button{transition:transform 120ms ease-out,background 150ms ease-out}button:active{transform:scale(0.97)}

.fx-root{container-type:inline-size}
h1,h2,h3{font-family:'Zen Kaku Gothic New','BIZ UDPGothic',sans-serif}h2{letter-spacing:-.02em}
.fx-band{position:relative;isolation:isolate;overflow:hidden;background:#0B0D12;color:#fff}
.fx-wrap{max-width:1184px;box-sizing:border-box;margin:0 auto;padding:32px clamp(16px,4vw,48px) 56px}
.fx-crumbs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;line-height:1.6;color:#9AA3B5}.fx-crumbs a{color:#8095FF}
.fx-en{margin:28px 0 0;font:400 clamp(56px,9cqi,120px)/.92 'Anton', 'Impact', sans-serif;color:#8095FF;white-space:nowrap;letter-spacing:.005em}
.fx-h1{margin:14px 0 0;font:900 clamp(26px,3.4cqi,40px)/1.35 'Zen Kaku Gothic New',sans-serif;color:#fff;letter-spacing:-.03em}
.fx-lead{margin:14px 0 0;max-width:34em;font-size:15px;line-height:1.9;color:#C5CBD8}
.fx-wm{position:absolute;right:-.03em;bottom:-.22em;font:400 clamp(160px,28cqi,360px)/1 'Anton', 'Impact', sans-serif;color:rgba(255,255,255,.04);z-index:-1;white-space:nowrap;pointer-events:none}
.fx-404{margin:20px 0 0;font:400 clamp(120px,22cqi,260px)/.86 'Anton', 'Impact', sans-serif;color:#8095FF;white-space:nowrap}
.fx-time{display:block;font:400 26px/1 'Anton', 'Impact', sans-serif;color:#8095FF;white-space:nowrap;margin-bottom:4px}
.fx-id{font:400 20px/1 'Anton', 'Impact', sans-serif;color:#1A3CFF;letter-spacing:.02em;white-space:nowrap}
@container(max-width:700px){.fx-en{font-size:16cqi}.fx-wm{font-size:44cqi}.fx-404{font-size:40cqi}.fx-wrap{padding:24px 20px 40px}}
</style>
</helmet>
<div class="fx-root" style="width: 100%; background: #FFFFFF; color: #172343; font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.75">
  <dc-import name="FreshHeader" hint-size="100%,80px"></dc-import>
  <section class="fx-band" aria-labelledby="fx-title"><div class="fx-wrap"><nav aria-label="パンくずリスト" class="fx-crumbs"><a href="FreshMain.dc.html">ホーム</a><span aria-hidden="true">/</span><span>検索</span></nav><p class="fx-en" aria-hidden="true">SEARCH</p><h1 id="fx-title" class="fx-h1">記事を探す</h1><p class="fx-lead">製品名・機能名・記事番号で探せます。</p></div><div class="fx-wm" aria-hidden="true">FIND</div></section>
  <main style="max-width: 1248px; box-sizing: border-box; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 64px">
    <div style="padding-top: 40px">
      <form role="search" style="display: flex; gap: 8px; max-width: 760px">
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">サイト内を検索</label>
        <input id="q" type="search" value="{{query}}" style="flex: 1 1 auto; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 16px; font: inherit; font-size: 18px; color: #172343; border: 1px solid #172343; border-radius: 4px">
        <button type="button" style="flex: 0 0 auto; white-space: nowrap; height: 48px; padding: 0 24px; background: #172343; color: #FFFFFF; border: 0; border-radius: 4px; font: inherit; font-size: 15px; cursor: pointer">検索</button>
      </form>
      <div style="display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; margin-top: 24px; font-size: 14px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><span role="group" aria-label="{{f.label}}" style="display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px"><span style="color: #59637A">{{f.label}}</span><sc-for list="{{f.options}}" as="o" hint-placeholder-count="3"><button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.name}}</button></sc-for></span></sc-for>
      </div>
      <sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 24px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #59637A"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>「{{query}}」　<span style="font-family: 'IBM Plex Mono', monospace">{{count}}</span> 件</p>
        <ol style="list-style: none; margin: 8px 0 0; padding: 0; max-width: 860px; border-top: 1px solid #172343">
          <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
            <li style="border-bottom: 1px solid #DDE2EF"><a href="Article.dc.html" style="display: block; padding: 16px 0; color: #172343; text-decoration: none">
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13px; line-height: 1.5; color: #59637A"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="{{r.code}}">{{r.id}}</span><span class="fx-id">{{r.no}}</span></span><span style="display: inline-flex; align-items: center; gap: 6px; color: #172343"><sc-if value="{{r.isHowto}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="m7 9 3 3-3 3m5 0h5"></path></svg></sc-if><sc-if value="{{r.isRef}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M14 3H6v18h12V7l-4-4Z"></path><path d="M14 3v4h4M9 13h6m-6 4h4"></path></svg></sc-if><sc-if value="{{r.isCmp}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M12 3v18M7 21h10M5 7h14"></path><path d="m5 7-3 7a3 3 0 0 0 6 0L5 7Zm14 0-3 7a3 3 0 0 0 6 0l-3-7Z"></path></svg></sc-if>{{r.kind}}</span><span style="display: inline-flex; align-items: center; gap: 6px"><span style="color: #15803D; display: grid"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></span>{{r.date}}</span></span>
              <span style="display: block; margin-top: 4px; font-size: 18px; font-weight: 700; overflow-wrap: anywhere">{{r.title}}</span>
              <span style="display: block; margin-top: 4px; font-size: 15px; color: #59637A">{{r.before}}<mark style="background: #FFF1B8; color: #172343; padding: 0 2px">{{r.hit}}</mark>{{r.after}}</span>
            </a></li>
          </sc-for>
        </ol>
      </sc-if>
      <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
        <section style="margin-top: 40px; max-width: 760px; border-top: 1px solid #172343; padding-top: 24px">
          <h1 style="margin: 0; font-size: 24px; line-height: 1.5; font-weight: 700">「{{query}}」に合う記事は見つかりませんでした</h1>
          <ul style="list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid #DDE2EF"><li style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid #DDE2EF"><span style="display: grid; padding-top: 2px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></span><span><strong>言い方を変える</strong><span style="display: block; font-size: 14px; color: #59637A">例：自動で整形 → Hooks</span></span></li><li style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid #DDE2EF"><span style="display: grid; padding-top: 2px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"></path></svg></span><span><strong>絞り込みを外す</strong></span></li><li style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid #DDE2EF"><span style="display: grid; padding-top: 2px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2V5Z"></path><path d="M4 20a2 2 0 0 0 2 2h13v-4"></path></svg></span><span><strong><a href="Glossary.dc.html">用語集</a>で調べる</strong></span></li></ul>
          <p style="margin: 24px 0 8px; font-size: 14px; font-weight: 700">よく探されている言葉</p>
          <p style="margin: 0; display: flex; flex-wrap: wrap; gap: 8px"><a href="#" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid #DDE2EF; border-radius: 4px; text-decoration: none; font-size: 15px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M3 12V3h9l9 9-9 9-9-9Z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>Hooks</a><a href="#" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid #DDE2EF; border-radius: 4px; text-decoration: none; font-size: 15px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M3 12V3h9l9 9-9 9-9-9Z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>MCP</a><a href="#" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid #DDE2EF; border-radius: 4px; text-decoration: none; font-size: 15px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M3 12V3h9l9 9-9 9-9-9Z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>プランの選び方</a><a href="#" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid #DDE2EF; border-radius: 4px; text-decoration: none; font-size: 15px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto"><path d="M3 12V3h9l9 9-9 9-9-9Z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>プロンプトキャッシュ</a></p>
        </section>
      </sc-if>
    </div>
  <div role="group" aria-label="データの切り替え（検証用）" style="position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; display: flex; gap: 2px; padding: 3px; background: #E5E5E5; border-radius: 999px"><sc-for list="{{toggle}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
  </main>
  <dc-import name="FreshFooter" hint-size="100%,260px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ds: 'hit', product: 'すべて', kind: 'すべて', role: 'すべて' };
  }
  renderVals() {
    const st = this.state;
    const code = (c) => "display: inline-grid; place-items: center; min-width: 28px; height: 20px; padding: 0 4px; box-sizing: border-box; border-radius: 2px; background: " + c + "; color: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 12px; line-height: 1; vertical-align: 1px";
    const ALL = [
      { id: 'CC', c: '#0B0D12', no: '07', kind: 'ハウツー', role: '開発者', date: '検証 11-01', title: 'Hooks で保存のたびに整形する', before: '書き換えの直後に決まったコマンドを動かす ', hit: 'Hooks', after: ' の設定。' },
      { id: 'CC', c: '#0B0D12', no: '13', kind: '現行仕様', role: '開発者', date: '検証 11-02', title: 'Hooks のイベント', before: '', hit: 'Hooks', after: ' で使えるイベントの一覧と、それぞれが動く時点。' },
      { id: 'SD', c: '#0B0D12', no: '02', kind: 'ハウツー', role: '開発者', date: '検証 10-28', title: 'Agent SDK で Hooks を使う', before: 'Agent SDK から ', hit: 'Hooks', after: ' を登録する方法。' },
      { id: 'GC', c: '#0B0D12', no: '01', kind: '比較', role: 'ビジネス職', date: '検証 11-02', title: 'Gemini CLI と Claude Code の比較', before: '自動で整形する仕組み（Claude Code の ', hit: 'Hooks', after: ' など）の違いも比べる。' },
    ];
    const pick = (key, val) => () => this.setState({ [key]: val });
    const opt = (key, names) => names.map((n) => ({ name: n, pressed: st[key] === n ? 'true' : 'false', pick: pick(key, n),
      style: 'border: 1px solid ' + (st[key] === n ? '#172343' : '#DDE2EF') + '; background: ' + (st[key] === n ? '#172343' : '#FFFFFF') + '; color: ' + (st[key] === n ? '#FFFFFF' : '#172343') + '; border-radius: 4px; padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer' }));
    const filters = [
      { label: '製品', options: opt('product', ['すべて', 'Claude Code', 'ほかの製品']) },
      { label: '種類', options: opt('kind', ['すべて', 'ハウツー', '現行仕様', '比較']) },
      { label: '対象', options: opt('role', ['すべて', '開発者', 'ビジネス職']) },
    ];
    const results = (st.ds === 'none' ? [] : ALL)
      .filter((r) => st.product === 'すべて' || (st.product === 'Claude Code' ? r.id === 'CC' : r.id !== 'CC'))
      .filter((r) => st.kind === 'すべて' || r.kind === st.kind)
      .filter((r) => st.role === 'すべて' || r.role === st.role)
      .map((r) => ({ ...r, code: code(r.c), isHowto: r.kind === 'ハウツー', isRef: r.kind === '現行仕様', isCmp: r.kind === '比較' }));
    const toggle = [['hit', '結果あり'], ['none', '結果なし']].map(([k, l]) => ({ label: l, pick: () => this.setState({ ds: k }),
      style: 'border: 0; border-radius: 999px; padding: 6px 14px; font: 13px system-ui, sans-serif; cursor: pointer; ' + (st.ds === k ? 'background: #FFFFFF; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,0.2)' : 'background: transparent; color: #444') }));
    const query = st.ds === 'none' ? '保存したら自動できれいにする' : 'Hooks';
    return { query, filters, results, count: results.length, hasResults: results.length > 0, noResults: results.length === 0, toggle };
  }
}
</script>
</body>
</html>
